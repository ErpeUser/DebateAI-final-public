version: 2
updates:
  # Versioned SHA-pinned actions must still be reviewed; no unattended merges.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/app/desktop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-nonmajor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      docs-nonmajor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app/desktop/chatgpt_oracle"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/app/release-signing-worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
