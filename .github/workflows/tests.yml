name: tests

on:
  push:
    branches: [master, hardening/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Repository safety and rename contracts
        run: python -m unittest discover -s ../scripts/tests -p 'test_*.py' -v
      - name: Independent data identity
        run: python -m unittest discover -s ../desktop/tests -p test_debateai_identity.py -v
      - name: Desktop release contract
        run: python -m unittest discover -s ../desktop/tests -p test_release_contract.py -v
      - name: Portable desktop unit contracts
        run: |
          for test_file in \
            test_paths.py \
            test_version_resource.py \
            test_windows_console.py \
            test_smoke_test.py \
            test_updater.py \
            test_platform_release_manifest.py; do
            python -m unittest discover -s ../desktop/tests -p "$test_file" -v
          done

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:pwa -- --dist
      - name: Calibration core and blind suite contracts
        run: node --test calibration-tests/core.test.mjs calibration-tests/suite.test.mjs
      - name: Calibration must be shipped in the production frontend
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          for (const file of ['calibration.html', 'calibration/core.mjs', 'calibration/lab.mjs', 'calibration/lab.css', 'calibration/launcher.mjs', 'calibration/launcher.css']) {
            if (!fs.statSync(`dist/${file}`).isFile()) throw new Error(`Missing bundled laboratory asset: ${file}`);
          }
          if (!fs.readFileSync('dist/index.html', 'utf8').includes('/calibration/launcher.mjs')) throw new Error('Laboratory is not wired into the application entry.');
          JS

  calibration-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Laboratory DOM and mocked audio/API contracts, not Windows hardware acceptance
        run: python -m unittest discover -s source/frontend/calibration-tests -p 'test_*.py' -v
