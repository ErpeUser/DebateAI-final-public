[alembic]
script_location = alembic
# The runtime override in alembic/env.py supplies the active DATABASE_URL.
# Keep this value canonical and non-secret for direct CLI help/inspection.
sqlalchemy.url = postgresql+asyncpg://debateai:replace-with-a-long-random-password@db:5432/debateai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
