version: 2
updates:
  # Keep the policy visible without creating a branch fan-out in the public
  # mirror. Security advisories remain handled by GitHub's security service.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/app/desktop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      frontend-nonmajor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      docs-nonmajor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app/desktop/chatgpt_oracle"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/app/release-signing-worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
