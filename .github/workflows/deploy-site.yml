name: docs-site-build

on:
  push:
    branches: [master]
    paths:
      - "source/docs-site/**"
      - "source/docs/**"
      - "source/site/**"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    paths:
      - "source/docs-site/**"
      - "source/docs/**"
      - "source/site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# This workflow validates the docs build. Publication is a separate, explicit action.

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/docs-site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
